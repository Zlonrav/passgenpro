<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпионский Математический Декодер</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161f30;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --text-muted: #8b9bb4;
            --danger-color: #ff3366;
            --success-color: #00ff00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .decoder-container {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mission-status {
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 25px;
            border-bottom: 1px dashed var(--text-muted);
            padding-bottom: 15px;
            min-height: 50px;
            line-height: 1.5;
            transition: color 0.3s ease;
        }

        .mission-status span {
            color: var(--accent-color);
            font-size: 22px;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
        }

        .mission-status.success-msg {
            color: var(--success-color);
        }

        .mission-status.error-msg {
            color: var(--danger-color);
        }

        .puzzle-display {
            font-size: 20px;
            color: var(--text-muted);
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .puzzle-display span {
            color: var(--success-color);
            font-weight: bold;
        }
        .stats-panel {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .stats-panel span strong {
            color: var(--accent-color);
        }

        .tumblers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .tumbler-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--text-muted);
            border-radius: 8px;
            padding: 12px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tumbler-box:hover {
            border-color: var(--accent-color);
            background: rgba(0, 255, 204, 0.05);
        }

        .tumbler-box.active {
            border-color: var(--accent-color);
            background: rgba(0, 255, 204, 0.15);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .tumbler-weight {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .tumbler-box.active .tumbler-weight {
            color: var(--accent-color);
        }

        .tumbler-status {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
        }

        .tumbler-box.active .tumbler-status {
            color: var(--accent-color);
        }

        .btn-action {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 14px 30px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-action:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .btn-action:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
            background: transparent;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="decoder-container">
    <h1>🕵️‍♂️ Математический Декодер</h1>
    <div class="mission-status" id="missionStatus">Генерация секретного шифра...</div>

    <div class="stats-panel">
        <span>Попытки: <strong id="attemptsCount">0</strong></span>
        <span>Время: <strong id="timerDisplay">00:00</strong></span>
        <span>Решено: <strong id="crackedCount">0/5</strong></span>
    </div>

    <div class="puzzle-display" id="puzzleDisplay">Уровень: <span>Раунд 1</span></div>

    <div class="tumblers-grid">
        <div class="tumbler-box" onclick="toggleTumbler(this, 256)">
            <div class="tumbler-weight">256</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 128)">
            <div class="tumbler-weight">128</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 64)">
            <div class="tumbler-weight">64</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 32)">
            <div class="tumbler-weight">32</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 16)">
            <div class="tumbler-weight">16</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 8)">
            <div class="tumbler-weight">8</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 4)">
            <div class="tumbler-weight">4</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 2)">
            <div class="tumbler-weight">2</div>
            <div class="tumbler-status">OFF</div>
        </div>
        <div class="tumbler-box" onclick="toggleTumbler(this, 1)">
            <div class="tumbler-weight">1</div>
            <div class="tumbler-status">OFF</div>
        </div>
    </div>

    <button class="btn-action" id="submitBtn" onclick="checkCode()">Проверить код</button>
</div>
<script>
    const MIN_NUMBER = 1;
    const MAX_NUMBER = 485;
    const TARGET_WINS = 5;

    let targetNumber = 0;
    let totalAttempts = 0;
    let solvedCount = 0;
    let totalSum = 0;
    
    let startTime;
    let timerInterval;
    let messageTimeout; // Таймер для автоматического скрытия уведомлений

    function initGame() {
        if (solvedCount >= TARGET_WINS) {
            clearInterval(timerInterval);
            document.getElementById("missionStatus").className = "mission-status success-msg";
            document.getElementById("missionStatus").innerHTML = "ДОСТУП РАЗРЕШЕН!<br>Вы успешно обошли защиту системы.";
            document.getElementById("puzzleDisplay").innerHTML = "СИСТЕМА <span>ВЗЛОМАНА</span>";
            document.getElementById("submitBtn").disabled = true;
            return;
        }
        
        targetNumber = Math.floor(Math.random() * (MAX_NUMBER - MIN_NUMBER + 1)) + MIN_NUMBER;
        
        document.getElementById("crackedCount").innerText = `${solvedCount}/${TARGET_WINS}`;
        document.getElementById("puzzleDisplay").innerHTML = `Раунд: <span>${solvedCount + 1}</span>`;
        
        // Очищаем таймауты и возвращаем обычные стили текста задания
        clearTimeout(messageTimeout);
        const statusElement = document.getElementById("missionStatus");
        statusElement.className = "mission-status";
        
        updateMissionStatus();
        resetTumblers();
        
        if (!timerInterval) {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }
    }

    function updateMissionStatus() {
        document.getElementById("missionStatus").innerHTML = `Сгенерировано число: <span>${targetNumber}</span><br>Соберите его двоичный код в уме!`;
    }

    function updateTimer() {
        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        const minutes = String(Math.floor(elapsedTime / 60)).padStart(2, '0');
        const seconds = String(elapsedTime % 60).padStart(2, '0');
        document.getElementById("timerDisplay").innerText = `${minutes}:${seconds}`;
    }
    function toggleTumbler(element, weight) {
        if (solvedCount >= TARGET_WINS) return;

        const isActive = element.classList.contains("active");
        const statusText = element.querySelector(".tumbler-status");

        if (isActive) {
            element.classList.remove("active");
            statusText.innerText = "OFF";
            totalSum -= weight;
        } else {
            element.classList.add("active");
            statusText.innerText = "ON";
            totalSum += weight;
        }
    }

    function resetTumblers() {
        totalSum = 0;
        const boxes = document.querySelectorAll(".tumbler-box");
        boxes.forEach(box => {
            box.classList.remove("active");
            box.querySelector(".tumbler-status").innerText = "OFF";
        });
    }

    function checkCode() {
        if (solvedCount >= TARGET_WINS) return;

        const statusElement = document.getElementById("missionStatus");
        clearTimeout(messageTimeout); // Сбрасываем прошлый таймер, если игрок кликнул раньше времени

        totalAttempts++;
        document.getElementById("attemptsCount").innerText = totalAttempts;

        if (totalSum === targetNumber) {
            solvedCount++;
            
            if (solvedCount >= TARGET_WINS) {
                initGame();
            } else {
                statusElement.className = "mission-status success-msg";
                statusElement.innerHTML = `УСПЕШНО!<br>Число ${targetNumber} взломано.`;
                resetTumblers();
                
                // Через 5 секунд автоматически запускаем следующий раунд и новое задание
                messageTimeout = setTimeout(initGame, 5000);
            }
        } else {
            statusElement.className = "mission-status error-msg";
            statusElement.innerHTML = `ОШИБКА РАСЧЕТА! Попробуйте снова.`;
            resetTumblers(); //<br>Вы собрали сумму ${totalSum}.
            
            // Через 5 секунд возвращаем текст текущего задания
            messageTimeout = setTimeout(() => {
                statusElement.className = "mission-status";
                updateMissionStatus();
            }, 5000);
        }
    }

    // Автозапуск шпионской математической игры
    window.onload = initGame;
</script>
</body>
</html>
